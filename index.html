<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>chinese-flashcards</title>
</head>

<body>
    <div id="container">
        <div id="question" class="card">
            <div class="character"></div>
        </div>
        <div id="answer" class="card">
            <div class="character"></div>
            <div id="pinyin"></div>
            <ol id="definition"></ol>
        </div>
    </div>
    <div id="options-container">
        <div id="options">
            <img src="src/assets/options.svg" alt="">
            <div id="categories-container"></div>
            <hr>
            <span>Email me </span><a href="mailto:kaialbertson@gmail.com">here!</a>
        </div>
        <div id="back">
            <img src="src/assets/back.svg" alt="">
        </div>
    </div>
    <form id="confidence">
        <img src="src/assets/thumb_down.svg" alt="">
        <input type="radio" name="rating" value="-2">
        <input type="radio" name="rating" value="-1">
        <input type="radio" name="rating" value="0">
        <input type="radio" name="rating" value="1">
        <input type="radio" name="rating" value="2">
        <img src="src/assets/thumb_up.svg" alt="">
    </form>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
